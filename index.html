<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Feliz Cumpleaños María</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100dvh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      padding: calc(15px + env(safe-area-inset-top)) 20px calc(15px + env(safe-area-inset-bottom)) 20px;
      overflow: hidden; 
      background-color: #050005; 
      position: fixed; 
    }

    #glitterCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1; 
      pointer-events: none; 
    }

    /* Tarjeta */
    .card {
      position: relative; 
      background-color: rgba(10, 0, 5, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 20, 147, 0.3);
      
      width: 100%;
      max-width: 500px; 
      max-height: 88dvh; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      
      /* Padding inferior un poco más grande (5vh) para alejar el texto de los stickers de abajo */
      padding: 4vh 20px 5vh 20px; 
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 60px rgba(255, 20, 147, 0.3);
      text-align: center;
      z-index: 1;
    }

    /* Imagen protagonista del centro */
    .main-image {
      width: 100%;
      max-width: 320px; 
      max-height: 40dvh; 
      object-fit: contain; 
      border-radius: 12px;
      margin-bottom: 2.5vh;
      border: 4px solid #ffffff;
      background-color: #ffffff;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Stickers con diseño FLUIDO: se agrandan o achican solos según el ancho de la pantalla */
    .corner-img {
      position: absolute;
      /* En móviles chicos miden 65px, en pantallas grandes llegan hasta 110px */
      width: clamp(65px, 18vw, 110px); 
      height: clamp(65px, 18vw, 110px);
      object-fit: cover;
      border-radius: 12px;
      background-color: #fff; 
      border: 3px solid #ffffff; 
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      z-index: 2;
    }

    /* Posicionamiento dinámico para que no se escapen de la pantalla */
    .top-left { top: clamp(-10px, -2vw, -20px); left: clamp(-10px, -2vw, -20px); transform: rotate(-12deg); }
    .top-right { top: clamp(-10px, -2vw, -20px); right: clamp(-10px, -2vw, -20px); transform: rotate(10deg); }
    .bottom-left { bottom: clamp(-10px, -2vw, -20px); left: clamp(-10px, -2vw, -20px); transform: rotate(8deg); }
    .bottom-right { bottom: clamp(-10px, -2vw, -20px); right: clamp(-10px, -2vw, -20px); transform: rotate(-10deg); }

    /* Textos con tamaño dinámico y protección contra cortes */
    .quote {
      /* Tamaño de fuente que fluye desde 0.9rem hasta 1.2rem */
      font-size: clamp(0.9rem, 4vw, 1.2rem); 
      color: #e0e0e0; 
      margin-bottom: 1.5vh;
      font-style: italic;
      line-height: 1.4;
      padding: 0 10px; /* Margen de seguridad lateral */
    }

    .title {
      /* Tamaño de fuente que fluye desde 1.35rem hasta 2rem */
      font-size: clamp(1.35rem, 6.5vw, 2rem); 
      color: #ffffff; 
      font-weight: 900;
      letter-spacing: -0.5px;
      line-height: 1.2;
      text-shadow: 0 0 15px rgba(255, 20, 147, 0.8), 0 0 30px rgba(255, 20, 147, 0.5);
      /* Estas dos reglas OBLIGAN al texto a bajar de renglón si es muy ancho, evitando que se corte en los bordes */
      overflow-wrap: break-word;
      word-wrap: break-word;
      width: 100%;
      padding: 0 15px; /* Evita que choque directamente contra los stickers */
    }
  </style>
</head>
<body>

  <canvas id="glitterCanvas"></canvas>

  <main class="card">
    <img src="migraña.jpg" alt="Migraña" class="corner-img top-left">
    <img src="puntacana.jpg" alt="Punta Cana" class="corner-img top-right" style="object-fit: contain; padding: 2px; background-color: #ffffff;">
    <img src="desakta2.jpg" alt="Extra 1" class="corner-img bottom-left" style="object-fit: contain; padding: 8px; background-color: #ffffff;">
    <img src="stanley.webp" alt="Extra 2" class="corner-img bottom-right" style="object-fit: contain; padding: 12px; background-color: #ffffff;">
    
    <img src="taladro.jpg" alt="Muela taladrando" class="main-image">

    <p class="quote">Porque para entenderlas, hace falta ser una de ellas</p>
    <h1 class="title">Feliz cumpleaños Maríaa</h1>
  </main>

  <script>
    const canvas = document.getElementById('glitterCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();

    const particlesArray = [];
    const colors = ['#FF00FF', '#FF1493', '#FF69B4', '#E6A8D7', '#FFFFFF'];

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5 + 0.5; 
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.alpha = Math.random(); 
        this.alphaChange = (Math.random() * 0.05 + 0.02) * (Math.random() < 0.5 ? 1 : -1);
      }

      draw() {
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        
        if(this.size > 1.2) {
            ctx.shadowBlur = this.size * 4;
            ctx.shadowColor = this.color;
        } else {
            ctx.shadowBlur = 0;
        }
      }

      update() {
        this.alpha += this.alphaChange;
        if (this.alpha <= 0.05 || this.alpha >= 1) {
          this.alphaChange *= -1; 
        }
        this.draw();
      }
    }

    function init() {
      particlesArray.length = 0;
      const numParticles = (canvas.width * canvas.height) / 1200; 
      for (let i = 0; i < numParticles; i++) {
        particlesArray.push(new Particle());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
      }
      requestAnimationFrame(animate);
    }

    init();
    animate();

    window.addEventListener('resize', () => {
      resizeCanvas();
      init();
    });
  </script>
</body>
</html>
